{
    "import" : [
            "/vendor/etc/init.msm8998.usb.cfg"
    ],
    "jobs" : [{
            "name" : "pre-init",
            "cmds" : [
                "export PATH /usr/local/bin:/bin:/usr/bin:/usr/sbin:/vendor/bin",
                "export LIBGL_DRIVERS_PATH /vendor/lib64/chipsetsdk",
                "write /proc/sys/vm/min_free_kbytes 10240",
                "mount debugfs /sys/kernel/debug /sys/kernel/debug mode=755",
                "write /sys/kernel/debug/hisi_inno_phy/role peripheral"
            ]
        }, {
            "name" : "init",
            "cmds" : [
                "start qrtr-ns",
                "symlink /sys/kernel/debug /d",
                "symlink /sys/kernel/config /config",
                "write /sys/module/firmware_class/parameters/path /system/lib/firmware",
                "chmod 777 /vendor/bin/init.msm8998.sh",
                "syncexec /system/bin/sh /vendor/bin/init.msm8998.sh",
                "wait /dev/dri/card0",
                "write /proc/1/oom_score_adj -1000",
                "write /proc/sys/kernel/hung_task_timeout_secs 90",
                "write /sys/kernel/hungtask/enable on",
                "exec /system/bin/udevadm trigger",
                "exec /system/bin/udevadm control --reload-rules",
                "exec /system/bin/udevadm trigger --attr-match=subsystem=input",
                "write /sys/kernel/hungtask/monitorlist whitelist,init,appspawn",
                "chown system system /sys/kernel/hungtask/userlist"
            ]
        }, {
            "name" : "boot",
            "cmds" : [
                "write /sys/block/zram0/disksize 1024M",
                "mkswap /dev/block/zram0",
                "swapon /dev/block/zram0",
                "chmod 0666 /dev/rfkill",
                "chmod 0666 /dev/video0",
                "chmod 0666 /dev/video1",
                "chmod 0666 /dev/uinput",
                "chmod 0666 /sys/class/leds/white:flash/brightness",
                "chmod 0666 /sys/class/leds/yellow:flash/brightness",
                "chmod 775 /sys/class/rfkill/rfkill0/state",
                "chown bluetooth bluetooth /dev/uhid",
                "chmod 777 /dev/tun",
                "chown bluetooth bluetooth /dev/tun",
                "chown blue_host blue_host /sys/class/rfkill/rfkill0/state",
                "chmod 0666 /sys/devices/platform/soc@0/ae00000.mdss/ae94000.dsi/ae94000.dsi.0/backlight/ae94000.dsi.0/brightness",
                "chmod 777 /dev/rtkbt_dev",
                "chmod 660 /dev/ppp",
                "chown net_manager net_manager /dev/ppp",
                "chmod 0440 /proc/interrupts",
                "chmod 0440 /proc/stat",
                "chmod 0640 /dev/xt_qtaguid",
                "chmod 0660 /proc/net/xt_qtaguid/ctrl",
                "chmod 0440 /proc/net/xt_qtaguid/stats",
                "chown system graphics /dev/graphics/fb0",
                "chmod 777 /system/bin/sdcard_mount.sh",
                "chmod 777 /system/bin/udisk_mount.sh",
                "chmod 666 /dev/sched_rtg_ctrl",
                "chown system system /dev/sched_rtg_ctrl"
            ]
        }, {
            "name" : "post-fs-data",
            "cmds" : [
                "restorecon",
                "start qrtr-ns",
                "start tqftpserv",
                "start pd-mapper",
                "start rmtfs",
                "start qmi-proxy",
                "wait /dev/block/misc",
                "chmod 777 /vendor/bin/dbus-daemon.sh",
                "exec /system/bin/sh /vendor/bin/dbus-daemon.sh",
                "chown update update /dev/block/misc",
                "chmod 0644 /dev/block/misc",
                "exec /system/bin/sh /vendor/bin/swclock-offset-boot.sh",
                "wait /dev/ttyGS1",
                "start serialshell"
            ]
        }
    ],
    "services": [
        {
            "name": "serialshell",
            "path": ["/system/bin/sh", "/vendor/bin/ttygs1_shell.sh"],
            "console": 0,
            "sandbox": 0,
            "uid": "root",
            "gid": ["shell", "log", "readproc"],
            "start-mode": "condition",
            "secon": "u:r:console:s0"
        }
    ]
}
